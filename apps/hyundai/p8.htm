<div class = "top title" >
  수선하고자 하는 <br>
  <span id = span_category > 티셔츠/멘투맨 </span> 디자인을 선택해주세요 </div>
<div class = main>
  <div class = content >
    <t-select id = sel_fit select >
    <div opt value = 'muscle' class = 'dv_fit r1 c1'>
      <div> 머슬핏 <br>
        <img src = './images/fit/fit_tshirt.svg'> </div> </div>

    <div opt value = 'tight' class = 'dv_fit r1 c2'>
      <div> 타이트핏 <br>
      <img src = './images/fit/fit_tshirt.svg'> </div> </div>
    <div opt value = 'regular' class = 'dv_fit r2 c12'>
      <div> 레귤러  <br>
      <img src = './images/fit/fit_tshirt.svg'> </div> </div>
    <div opt value = 'semiover' class = 'dv_fit r3 c1'>
      <div> 세미 오버핏 <br>
      <img src = './images/fit/fit_tshirt.svg'> </div> </div>
    <div opt value = 'over' class = 'dv_fit r3 c2'>
      <div> 오버핏 <br>
      <img src = './images/fit/fit_tshirt.svg'> </div> </div>
    </t-select>
  </div content>
</div main>

  <button class = 'btn_next' onclick = "next()"> 다음 </button>
