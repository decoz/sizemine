<script>

pageview.addEventListener('touchmove', function(e) {e.preventDefault()}, false);

let gtype = ''
let page = 0
let height = 170
let bodysize = { //default body size
      "ne": 33,
      "sh": 43,
      "ar": 57,
      "ch": 88,
      "wa": 75,
      "he": 97,
      "le": 91
  }


function next(){
  //document.location.href = url

  page++
  pageview.scrollLeft = pageview.clientWidth * page
  //pageview.scrollLeft += pageview.clientWidth
  console.log( pageview.scrollLeft )
  //alert(String(page) + "/" + String(pageview.scrollLeft))
  lb_msg.innerText = String(page) + "/" + String(pageview.scrollLeft)
}

function prev(){
  page--
  if(page < 0) page = 0

  pageview.scrollLeft = parseInt(pageview.clientWidth) * page


  //pageview.scrollLeft = -1 * pageview.clientWidth
  //pageview.scrollLeft -= pageview.clientWidth
  //console.log( pageslide.style.left )
  //alert(String(page) + "/" + String(pageview.scrollLeft))
  lb_msg.innerText = String(page) + "/" + String(pageview.scrollLeft + "/" + String(parseInt(pageview.clientWidth) * page))


}

function click_sex(sex){
  let parent = event.srcElement.parentElement
  for(let c of parent.children ) c.classList.remove('focusing')
  event.srcElement.classList.add('focusing')
}

function category(type) {
  gtype = type
  next()
}

//next()

</script>

<script  type = 'module'>

import imgMarker from '/js/imgmarker.js'
import * as SM from '/js/sizemine.js'
import dragUpload from '/js/dragupload.js'
import dot from '/js/dot.js'
import selector from '/js/selector.js'


customElements.define("img-marker", imgMarker)

customElements.define('t-select', selector)

function isAndroid(){
    var userAgent = window.navigator.userAgent.toLowerCase(),
      safari = /safari/.test( userAgent ),
      ios = /iphone|ipod|ipad/.test( userAgent );

    if (ios) {
      if (!standalone && safari) {
        // Safari
        return false;
      } else if (!standalone && !safari) {
        // iOS webview
        return false;
      };
    } else {
      if (userAgent.includes('wv')) {
        // Android webview
        return true;
      } else {
        // Chrome
        return false;
      }
    };


}

mydrag.onFileDrop = e => {
  console.log("onfiledrop")
  SM.upload(mydrag.files[0], sizearr => {
    bodysize = sizearr
    console.log(sizearr, SM.dsize)
    let bodytype = SM.getType()
    let sizelabels = SM.dlabels.Get('bodysize.').Arr()
    let typelabels = SM.dlabels.Get('bodytype.').Arr()

    span_bodytype.innerText = typelabels[bodytype]
    /*
    sizetable.innerHTML = ''
    */

    for(let key in sizearr){
      let id = "sz_" + key
      let obj = document.getElementById(id)
      if( obj ) obj.innerText = sizearr[key] + 'cm'
    }

    //console.log("bodytype:",SM.getType())
    btn_save.onclick = function(e){

      console.log("send result to android",sizearr)

      if( isAndroid() ){
        Android.retsizes(JSON.stringify(sizearr))
        console.log('success',SM.sizes)
      } else {
        console.log("can't find android function")
      }
    }

    next()
  })

}

sel_fit.onselect = v => {
  console.log(bodysize)
  const rec_size = {
    'rec_outseam':parseInt( bodysize.le / 3),
    'rec_shoulder':bodysize.sh,
    'rec_chest':bodysize.ch,
    'rec_sleeve':parseInt( bodysize.ar / 3)
  }

  const weight = {
    'muscle' : 0.95,
    'tight' : 0.97,
    'regular': 1,
    'semiover' : 1.03,
    'over' : 1.08
  }

  for(let k in rec_size) {
    document.getElementById(k).value = parseInt( rec_size[k] * weight[v] )
  }

}


</script>
