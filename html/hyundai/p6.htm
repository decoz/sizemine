<div class = 'qbox' id = 'dv_mode'>
  <div>  수선하고자 하는 의류의 수치를 정확히 알고있나요?  </div>
  <t-select id = sel_mode select >
    <div opt value = 'size'> 네 알고있습니다.   </div>
    <div opt value = 'nosize'> 아니오 잘 모르겠습니다. </div>
  </t-select>
</div>


<div class = "top title" >
  수선하고자 하는 <br>
  <span id = span_type > 티셔츠/멘투맨 </span> 디자인을 선택해주세요 </div>
<div class = main>
  <div class = content >
    <div id = dv_selector >
    <t-select id = sel_gtype select >
      <img opt value = 'type1' class = 'img_gtype r1 c1' src = './images/category/tshirt1.svg'> </img>
      <img opt value = 'type2' class = 'img_gtype r1 c2' src = './images/category/tshirt2.svg'> </img>
      <img opt value = 'type3' class = 'img_gtype r2 c1' src = './images/category/tshirt3.svg'> </img>
      <img opt value = 'type4' class = 'img_gtype r2 c2' src = './images/category/tshirt4.svg'> </img>
      <img opt value = 'type5' class = 'img_gtype r3 c1' src = './images/category/tshirt5.svg'> </img>
      <img opt value = 'type6' class = 'img_gtype r3 c2' src = './images/category/tshirt6.svg'> </img>
    </t-select>
    </div dv_selector>
  </div content>
</div main>
<div class = footer>

</div>
