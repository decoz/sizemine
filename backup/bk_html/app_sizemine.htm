  </tr></table>

  <div id = dv_move >
      <button id = btn_prev onclick = 'move_prev()'> back </button>
      <button id = btn_next onclick = 'move_next()' disabled > continue > </button>
  </div>

<script type = 'module'>
import imgMarker from '/js/imgmarker.js'
import * as SM from '/js/sizemine.js'
import dragUpload from '/js/dragupload.js'
import dot from '/js/dot.js'

customElements.define("img-marker", imgMarker)
customElements.define("drag-upload", dragUpload)

mydrag.onFileDrop = e => {
  console.log("onfiledrop")
  SM.upload(mydrag.files[0], sizearr => {
    console.log(sizearr, SM.dsize)
    let bodytype = SM.getType()
    let sizelabels = SM.dlabels.Get('bodysize.').Arr()
    let typelabels = SM.dlabels.Get('bodytype.').Arr()

    img_bodytype.src = 'bodytype' + bodytype + '.png'
    txt_bodytype.innerText = '나의 체형은 ' + typelabels[bodytype]

    sizetable.innerHTML = ''
    for(let key in sizearr){
      let sizename = sizelabels[key], size = sizearr[key]
      let tr = document.createElement('tr')
      tr.innerHTML = '<th>' + sizename + '</th>' +
                    '<td>' + size + 'cm </td>'
      sizetable.appendChild(tr)
    }

    btn_next.disabled = false
    console.log("bodytype:",SM.getType())


  })


}

</script>



<script>
var pages = scroller.children.length
var page = 0
tbl_screen.style.width = pages * 100 + 'vw'
console.log(pages)

function check_page(p){

  switch(p){
  case 0 :
    let sex = document.querySelector('input[name="sex"]:checked')
    let height = input_height.value
    console.log(sex.value, height)
    if(sex && height ) btn_next.disabled = false
    break
  case 1 :
    let fit1 = document.querySelector('input[name="fit1"]:checked')
    let fit2 = document.querySelector('input[name="fit2"]:checked')
    if(fit1 && fit2) btn_next.disabled = false
    break



  }


}

function move_prev() {
  //let newleft = parseInt(scroller.style.left) + window.innerWidth
  //scroller.style.left =  newleft
  let n = parseInt(scroller.style.left)
  if(!n) n = 0
  scroller.style.left =  n + window.innerWidth
  page--
  console.log( scroller.style.left)

}
function move_next() {
  //let newleft = parseInt(scroller.style.left + "") - window.innerWidth
  //scroller.style.left =  newleft
  let n = parseInt(scroller.style.left)
  if(!n) n = 0
  scroller.style.left =  n - window.innerWidth
  page++
  console.log( scroller.style.left)
  if(page != 2 ) btn_next.disabled = true
}
</script>
