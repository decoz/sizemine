<html>
<header>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/css/goodmine.css" rel="stylesheet" />
  <link href="/css/common.css" rel="stylesheet" />

</header>

<body>
<div id = container >
  <div class = 'top r1 c12'>
    <img class = 'c1' src = '/images/sizemine_logov1.png'>
    <div class = 'dv_lang c2'>
      <span class = lmsg >언어설정</span>
      <select id = sel_lang>
        <option value = ko > 한국어</option>
        <option value = jp > 日本語 </option>
        <option value = en > english </option>
      </select>
    </div>
    </div top>
  <div class = 'left c1 r2'>

    <t-select id = sel_menu select >
      <div opt class = lmsg >실측 치수 입력</div>
      <div opt class = lmsg >사이즈마인 통계</div>
    </t-select>
  </div>

  <div id = 'div_editgood' class = 'r2 c2'>
    <div id =  dv_select class = 'r1 c1' >
      <div class = dv_header>
        <div class = headerbox> </div>
        <span class = lmsg >템플릿 선택</span>
      </div dv_header> <br>
      <t-dbselect selsize = 1 id = sel_tpl url = '/api/template/list?field=tpl_name'
        css = '
        select {
          font-size:1rem;
        }
        '
      >
      </t-dbselect>
      <img-marker id = img_tpl> </img-marker>
    </div dv_select>

    <div id = dv_tag class = 'r1 c2' >
      <div class = dv_header>
        <div class = headerbox> </div>
        <span class = lmsg> 상품태그 </span>
      </div dv_header> <br>
      <table id = tbl_tag >


      </table>
    </div dv_tag>

    <d-view id = dv_size class = 'r2 c12' >
      <div class = dv_header>
        <div class = headerbox> </div> <span class = lmsg> 사이즈 입력 </span>  </div> <br>
      <table id = tbl_size >
        <thead id = thead_size >

        </thead>
        <tbody id = tbody_size dot = 'gsize' iter = 'tr[dot]' >

        </tbody>
      </table>
      <div class = flex>
        <button onclick = 'addRow(sizearr)' class = lmsg>사이즈 추가</button>
        <button onclick = 'removeRow()' class = lmsg>사이즈 삭제</button>
      </div>
    </d-view>
  </div edit_good>

  <div id = dv_save class = 'r3 c12' >
    <button id = btn_cancel class = lmsg >취소</button>
    <button id = btn_save class = lmsg>저장하기</button>

  </div>
</div container>
</body>
</html>

<script>
let gsize_labels, sizearr

function addRow(sizearr = sizearr) {
  const tbody = tbody_size
  const tr = document.createElement('tr')
  tr.setAttribute('dot','')
  let rows = `<th class = 'headcolumn'> <input dot = 'sname'> </th>`
  for(let k in sizearr) {
    rows += `<td> <input type = number dot = '${k}'> </input> </td> \n`
  }
  tr.innerHTML += `${rows}`
  tbody.appendChild(tr)
}

function removeRow() {
  const tbody = tbl_size.children[0]
  const arr = tbody.children
  console.log(arr)
  if(arr.length > 1) tbody.removeChild( arr[arr.length-1 ] )

}

</script>


<script type = 'module'>
import selector from '/js/selector.js'
import dbSelect from '/js/dbselect.js'
import imgMarker from '/js/imgmarker.js'
import dot from '/js/dot.js'
import dTable from '/js/dtable.js'
import dView from '/js/dview3.js'
import * as SM from '/js/sizemine.js'
import * as MI from '/js/mineif.js'

customElements.define('t-select', selector)
customElements.define('t-dbselect', dbSelect)
customElements.define('d-table', dTable)
customElements.define('img-marker', imgMarker)
customElements.define('d-view', dView)


let vid = '<%=vid%>'
let gid = '<%=gid%>'
let tpl_name
var lang = '<%=lang%>'


//gid = 'T0002'

const tlang_url = '/lang/template.lang'
const lang_url = '/lang/goodmine.lang'
const gslang_url = '/lang/goodsize.lang'

var dlang = null
var dlang_tpl = null
var dlang_gs = null

await init(gid, vid)

function set_lang(lang){
  const l = dlang.Arr()
  console.log('------',l)
  for(const el of document.querySelectorAll('.lmsg')){
    const msg = el.innerText.replace(/\s/g, '')
    if(l[lang] && l[lang][msg]) el.innerText = l[lang][msg]
  }

  const tl  = dlang_tpl.Arr()
  if(tl[lang]) sel_tpl.setLabels(tl[lang])

  const gsl = dlang_gs.Arr()
  if(gsl[lang]) img_tpl.setLabels(gsl[lang])
  for(const th of document.querySelectorAll('.th_size')){
    const sname = th.getAttribute('sname')
    if(gsl[lang][sname] ) th.innerText = gsl[lang][sname]
  }


}

async function init(gid, vid){
  console.log(`matchmine - gid:${gid} , vid:${vid}`)

  dlang_tpl = dot.tabParse( await MI.promiseGet(tlang_url) )
  dlang = dot.tabParse( await MI.promiseGet(lang_url) )
  dlang_gs = dot.tabParse( await MI.promiseGet(gslang_url) )

  console.log('template.lang:',dlang, dlang_tpl)

  let [garr]  = await Promise.all( [ SM.loadGood(gid, vid, true) ] )
  let tagarr = await SM.loadTaglist()
  setTags(tagarr)
  console.log('----------------',tagarr)
  gsize_labels = SM.dlabels.Get('goodsize').Arr()

  if( !SM.dgsizes ) return
  console.log("garr:",SM.dgsizes.Str())
  tpl_name = SM.tpl_name
  //console.log( SM.dtpl.Get('name').V() )

  const sizes = SM.dtpl.Get("sizes.").Arr()
  sizearr = sizes
  img_tpl.setMarkers(sizes)
  img_tpl.setImg(SM.dtpl.Get("image.").V())
  setDview(sizes)

  const dgsizes = new dot('.gsize')
  dgsizes.c = SM.dgsizes.c

  console.log(dgsizes.Str())
  dv_size.Put(SM.dgsizes)
  dv_size.style.visibility = 'visible'
  //setHeader( thead_size, SM.dgsizes.Arr() )

  if(lang != 'kr') set_lang(lang)

}

function getTags(){
  const tdlist = tbl_tag.querySelectorAll('td[selected]')
  let tags = ''
  for(const td of tdlist){
    if(tags != '') tags += ','
    tags += td.getAttribute('tagid')
  }
  console.log('getTags:',tags)
  return tags

}


function setTags(arr){

  let first = true
  console.log('setTag:',arr)
  for(const path in arr) {
    let tr = document.createElement('tr')
    if(first) first = false
    else tr.style.visibility = 'hidden'

    let html = `<th class = lmsg> ${path} </th> `
    for(let name in arr[path]) {
      html += `
        <td tagid = ${name} class = lmsg >
        ${arr[path][name]} </td>
      `
    }
    tr.innerHTML = html
    const tdarr = tr.querySelectorAll('td')

    for(const td of tdarr){
      td.onclick = e => {
        const p = td.parentElement
        const next = p.nextElementSibling
        if(next) next.style.visibility = 'inherit'
        for(const otd of p.children)
          otd.removeAttribute('selected')
        td.setAttribute('selected','')
      }
    }
    tbl_tag.appendChild(tr)
  }

}


btn_save.onclick = async function(e){

  console.log(dv_size.Get().Arr())
  const d = dv_size.Get()
  const putarr = {
    'gid':gid,
    'vid':vid,
    'sizes':d.Str(),
    'tags':getTags(),
    'tpl_name':tpl_name
  }

  const res = await MI.postJson('/api/good/put', putarr)
  if( parent != window ) frameElement.getRootNode().host.close()

}

btn_cancel.onclick = e => {
  //console.log(parent == window?'direct loading':'iframe window')
  if( parent != window ) frameElement.getRootNode().host.close()
}


sel_menu.onselect = (value) => {
  console.log(value)
}

sel_lang.onchange = (v) => {
  lang = sel_lang.value
  set_lang(lang)

}

sel_tpl.filter = function(data) {
  let arr = JSON.parse(data)
  return JSON.stringify( arr.map(d => d.tpl_name) )
}

sel_tpl.sync()
if( tpl_name != undefined ) sel_tpl.select( tpl_name )

sel_tpl.onselect = async function(v) {

  await SM.loadTpl(v)
  const sizes = SM.dtpl.Get("sizes.").Arr()
  img_tpl.setMarkers(sizes)
  img_tpl.setImg(SM.dtpl.Get("image.").V())
  tpl_name = v
  setDview(sizes)
  sizearr = sizes
  dv_size.style.visibility = 'visible'
  console.log()

}


function setHeader( sizearr = sizearr){
  const gsl = dlang_gs.Arr()

  let cols = '<th class = lmsg > 사이즈 </th>'
  for(let k in sizearr)
    cols += `<th sname = ${k} class = th_size > ${ gsl[k]? gsl[k] : k} </th> \n`
  thead_size.innerHTML = `<tr> ${cols} <tr>`


}


function setDview(sizearr){

  console.log('setTable:',sizearr)
  const tbl = tbl_size
  setHeader( sizearr)
  addRow(sizearr)
  dv_size._buildTpl()

  console.log(tbl, sizearr)


}




</script>
