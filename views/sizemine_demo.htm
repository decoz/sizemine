<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/css/common.css" rel="stylesheet" />
<link href="/css/sizemine_demo.css" rel="stylesheet" />
</head>

<body>

<d-popup id = popup
  title = 'popup test'
  showframe = false
  css = '
    width:400px;
    height:800px;
    background:white;
  '
> </d-popup>

<d-popup id = popup2
  title = 'popup test'
  showframe = false
  css = '
    width:1200px;
    height:800px;
  '
> </d-popup>

<div class = container>
<div class = title>
  <span class = 'red'> 사이즈마인 </span>으로 사이즈 추천 받기
</div>
<div id = dv_show class = show_window>

</div show_window>
</div container>

</body>
<script type = 'module'>
import dPopup from '/js/dpopup.js'
customElements.define("d-popup", dPopup)

const items = [
   '라쿤홀가 니트 <br> ₩ 49,000',
   '실켓 롤업 티셔츠 <br> ₩ 14,000',
   '죠셉 레글런 블라우스 <br> ₩ 132,000',
   'BEE 청바지 <br> ₩ 31,000',
   '7090 팬츠 <br>  ₩ 32,000',
   '빈티 보이프랜드 팬츠 <br> ₩ 32,000'
]

const sizes = [
  'S,M,L',
  'S,M,L',
  'S,M,L',
  'S,M,L',
  '25,26,27,28',
  '25,26,27,28,29'
]

function init_goods() {
  let html = ''
  for(let i=0; i<6; i++){
    const gid = `dm_${i}`
    let szhtml = `<div class = 'size_info r2 c2'> \n`

    const szarr = sizes[i].split(',')
    for(const sz of szarr)
      szhtml += `<div class = sizemarker> ${sz} </div>\n`
    szhtml += '</div>\n'

    html += `
    <div class = div_good gid = dm_${i} >
      <img class = 'r1 c12 good_image' src = '/images/sizemine_demo/img_${i+1}.png'>
      <div class = 'r2 c1 good_info'>
        ${items[i]}
      </div>
      <div class = 'size_info r2 c2'>
        ${szhtml}
      </div>
    </div div_good>
    `
  }

  dv_show.innerHTML = html
}
init_goods()

const divs =  document.querySelectorAll('.div_good')
for(const dv of divs){
  dv.addEventListener('click', e => {
    const gid = dv.getAttribute('gid')

    if(e.ctrlKey) popup2.open(`/view/goodmine?gid=${gid}`)
    else popup.open(`/view/sm2?gid=${gid}`)
  })
}


</script>
