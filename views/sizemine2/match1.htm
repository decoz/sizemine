<div class = dv_msg >
상품 상세 사이즈 비교
</div>

<div class = main>
  <div class = content >
    <div id = dv_sizeimg class = 'r1 c1' >
        <img-marker
          id = 'match_avatar'
          src = '/images/sizemine/illustrations/avatar_s.png'
          fontsize = '9'>
    </div>
    <div class = 'r2 c1 font_b1' >
      <div> 상품 상세 사이즈 </div>
      <div id = dv_recommand class = font_b3 >
        고객님께 추천하는 사이즈는
        <span id = span_recsize > L </span> 입니다.
      </div>
    </div>
    <div id = dv_othersizes class = 'r3 c1' >
      <div class = 'font_b3'>
      옆으로 넘겨보세요
      </div>
      <table>
        <tr id = tr_sizes>
          <th> 사이즈 </th>
          <td> S </td>
          <td> M </td>
          <td> L </td>
        </tr>
      </table>

      <div class = 'r2 c1'>
        <div onclick = "move('match')" class = 'dv_btn bg_white' id = btn_prev> < &nbsp 이전 </div>        
      </div>
    </div dv_othersizes>
  </div content>
</div main>
